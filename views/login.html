<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Campus Memories</title>
  <link rel="stylesheet" href="/css/style.css?v=5" />
</head>
<body>
  <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>welcome back</h2>
      <p class="auth-subtitle">your batch missed you</p>

      <div id="alert" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="college email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">let’s go</button>
      </form>

      <p class="auth-footer">
        new here? <a href="/signup">join your batch</a>
      </p>
      <p class="auth-footer"><a href="/">Back to home</a></p>
    </div>
  </div>

  <script src="/js/copy.js?v=5"></script>
  <script src="/js/api.js?v=5"></script>
  <script src="/js/auth.js"></script>
  <script>
    redirectIfAuth();
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
